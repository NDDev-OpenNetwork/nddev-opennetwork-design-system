name: nddev_opennetwork_design_system
description: Open NDDev OpenNetwork design tokens and Flutter theme primitives.
version: 0.0.1-alpha.8
repository: https://github.com/NDDev-OpenNetwork/nddev-opennetwork-design-system
issue_tracker: https://github.com/NDDev-OpenNetwork/nddev-opennetwork-design-system/issues
license: AGPL-3.0-only
publish_to: none

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
  assets:
    - assets/fonts/OFL.txt
