name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.58.0'
      - name: Install verified Flutter SDK
        shell: bash
        run: |
          flutter_archive="$RUNNER_TEMP/flutter-sdk.tar.xz"
          curl --fail --show-error --location --retry 2 --max-time 300 \
            https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.47.7-stable.tar.xz \
            --output "$flutter_archive"
          echo "af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230  $flutter_archive" | sha256sum --check -
          tar -xf "$flutter_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.4'
      - name: Install pinned launcher renderer
        run: python3 -m pip install --require-hashes -r tools/requirements-icons.txt
      - name: Resolve Flutter dependencies
        working-directory: packages/flutter
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: bash tools/with-renderer-zlib.sh just check
